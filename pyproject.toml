[project]
name = "myuml-mcp"
version = "0.1.0"
description = "MCP server for the UMass Lowell MyUML API"
readme = "README.md"
authors = [
    { name = "Jack Manning", email = "eastarctica@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[project.scripts]
myuml-mcp = "myuml_mcp:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
